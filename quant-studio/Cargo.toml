[package]
name = "quant-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
dotenv = "0.15"
longport = "4.3.3"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.4", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
url = "2"
toml = "0.8"
